events {
    worker_connections 1024;
}

http {
    # Zona rate-limit dipisah per jenis user agar banjir trafik satu role
    # tidak menghabiskan jatah role lain (pola bulkhead).
    limit_req_zone $binary_remote_addr zone=auth_zone:5m        rate=20r/m;
    limit_req_zone $binary_remote_addr zone=penitip_zone:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=penjastip_zone:10m  rate=120r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:5m       rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m      rate=120r/m;

    upstream auth_backend {
        server order-auth:3002;
    }
    upstream penitip_backend {
        least_conn;
        server order-penitip-1:3002;
        server order-penitip-2:3002;
    }
    upstream penjastip_backend {
        least_conn;
        server order-penjastip-1:3002;
        server order-penjastip-2:3002;
    }
    upstream admin_backend {
        server order-admin:3002;
    }

    # /v1/sessions dipakai dua role: GET = penitip melihat sesi,
    # POST/PATCH/DELETE = penjastip mengelola sesi miliknya.
    map $request_method $sessions_backend {
        default   penjastip_backend;
        GET       penitip_backend;
        HEAD      penitip_backend;
    }

    server {
        listen 8080;

        # Gunakan Docker internal DNS agar IP backend selalu fresh
        resolver 127.0.0.11 valid=10s ipv6=off;

        # CORS untuk semua response
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id, Idempotency-Key" always;

        # Handle preflight OPTIONS
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id, Idempotency-Key" always;
                return 204;
            }
            return 404;
        }

        # ---------- ADMIN ----------
        location ~ ^/v1/admin/(stores|products) {
            client_max_body_size 5m;
            limit_req zone=admin_zone burst=10 nodelay;
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location ~ ^/v1/admin/(users|sessions|orders|offers|audit) {
            limit_req zone=admin_zone burst=10 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/admin/payments {
            limit_req zone=admin_zone burst=10 nodelay;
            proxy_pass http://payment-service:3003;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/admin/tracking {
            limit_req zone=admin_zone burst=10 nodelay;
            proxy_pass http://tracking-service:3004;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # ---------- AUTH ----------
        location /v1/login {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://auth_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/register {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://auth_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/me {
            proxy_pass http://auth_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # ---------- PENJASTIP ----------
        location = /v1/sessions/me {
            limit_req zone=penjastip_zone burst=20 nodelay;
            proxy_pass http://penjastip_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/penjastip {
            limit_req zone=penjastip_zone burst=20 nodelay;
            proxy_pass http://penjastip_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/offers {
            limit_req zone=penjastip_zone burst=20 nodelay;
            proxy_pass http://penjastip_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # ---------- PENITIP ----------
        location /v1/titipan {
            limit_req zone=penitip_zone burst=10 nodelay;
            proxy_pass http://penitip_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/orders {
            limit_req zone=penitip_zone burst=30 nodelay;
            proxy_pass http://penitip_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # ---------- DIPILIH BERDASARKAN HTTP METHOD ----------
        location /v1/sessions {
            limit_req zone=penitip_zone burst=10 nodelay;
            proxy_pass http://$sessions_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # ---------- CATALOG SERVICE ----------
        location /v1/items {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/toko {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/stores {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/catalog {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/products {
            client_max_body_size 5m;
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /uploads/ {
            proxy_pass http://catalog-service:3001;
            proxy_set_header Host $host;
        }

        # ---------- PAYMENT & TRACKING ----------
        location /v1/payments {
            limit_req zone=api_per_ip burst=30 nodelay;
            proxy_pass http://payment-service:3003;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/tracking {
            limit_req zone=api_per_ip burst=50 nodelay;
            proxy_pass http://tracking-service:3004;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # health check
        location /health {
            proxy_pass http://catalog-service:3001;
            proxy_set_header Host $host;
        }
    }
}