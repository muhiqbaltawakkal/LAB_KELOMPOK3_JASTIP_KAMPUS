events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/m;
    upstream order_backend {
        least_conn;
        server order-service-1:3002;
        server order-service-2:3002;
        server order-service-3:3002;
    }
    server {
        listen 8080;

        # CORS untuk semua response
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id, Idempotency-Key";

        # Handle preflight OPTIONS
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id, Idempotency-Key";
                return 204;
            }
            return 404;
        }

        # catalog-service
        location ~ ^/v1/admin/(stores|products) {
            client_max_body_size 5m;
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location ~ ^/v1/admin/(users|sessions|orders|offers|audit) {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/admin/payments {
            proxy_pass http://payment-service:3003;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/admin/tracking {
            proxy_pass http://tracking-service:3004;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/items {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/toko {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # order-service
        location /v1/orders {
            limit_req zone=api_per_ip burst=10 nodelay;
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/catalog {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/login {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # payment-service
        location /v1/payments {
            limit_req zone=api_per_ip burst=5 nodelay;
            proxy_pass http://payment-service:3003;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # tracking-service
        location /v1/tracking {
            limit_req zone=api_per_ip burst=10 nodelay;
            proxy_pass http://tracking-service:3004;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/me {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/stores {
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/products {
            client_max_body_size 5m;
            proxy_pass http://catalog-service:3001;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /uploads/ {
            proxy_pass http://catalog-service:3001;
            proxy_set_header Host $host;
        }
        location /v1/register {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/sessions {
            limit_req zone=api_per_ip burst=10 nodelay;
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/titipan {
            limit_req zone=api_per_ip burst=10 nodelay;
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/offers {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }
        location /v1/penjastip {
            proxy_pass http://order_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
        }

        # health check
        location /health {
            proxy_pass http://catalog-service:3001;
            proxy_set_header Host $host;
        }
    }
}
