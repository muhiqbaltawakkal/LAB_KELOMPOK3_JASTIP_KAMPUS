version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  catalog-service:
    build: ./services/catalog-service
    deploy:
      replicas: 3 # Menjalankan 3 salinan service
    environment:
      DATABASE_URL: postgres://postgres:lab@postgres:5432/catalog
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - catalog-service