version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  catalog-service:
    build: ./services/catalog-service
    volumes:
      - ./dataset:/dataset:ro
    environment:
      REDIS_URL: redis://redis:6379
      SEED_PATH: /dataset/catalog-seed.json
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    ports:
      - "3002:3002"
    environment:
      CATALOG_URL: http://catalog-service:3001
      REDIS_URL: redis://redis:6379
      JWT_SECRET: rahasia-kelompok-ganti-ini
    depends_on:
      - catalog-service
      - redis

  payment-service:
    build: ./services/payment-service
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  tracking-service:
    build: ./services/tracking-service
    ports:
      - "3004:3004"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - catalog-service
      - order-service