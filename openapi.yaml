openapi: 3.0.3
info:
  title: Jastip Kampus API
  version: 2.0.0
  description: Kontrak gateway katalog, sesi jastip, titipan, escrow, dan tracking. Dibekukan 2026-08-22 untuk serah artefak.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.jastip-kampus.local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    SessionInput:
      type: object
      required: [storeId, productIds, kapasitas, batasWaktu]
      properties:
        storeId: { type: integer, minimum: 1 }
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        kapasitas: { type: integer, minimum: 1 }
        batasWaktu: { type: string, format: date-time }
    TitipanInput:
      type: object
      required: [sesiId, barangId, qty]
      properties:
        sesiId: { type: integer, minimum: 1 }
        barangId: { type: integer, minimum: 1 }
        qty: { type: integer, minimum: 1 }
paths:
  /v1/stores:
    post:
      operationId: createStore
      summary: Buat toko milik penjastip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, alamat, kategori]
              properties:
                nama: { type: string }
                alamat: { type: string }
                kategori: { type: string }
      responses:
        "201": { description: Toko dibuat }
        "401": { description: Token tidak valid }
        "403": { description: Bukan penjastip }
  /v1/stores/me:
    get:
      operationId: listMyStores
      summary: Daftar toko milik akun aktif
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar toko }
        "401": { description: Token tidak valid }
  /v1/products:
    post:
      operationId: createProduct
      summary: Tambah produk dengan foto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tokoId, nama, kategori, harga, stok, satuan, foto]
              properties:
                tokoId: { type: integer }
                nama: { type: string }
                kategori: { type: string }
                harga: { type: integer, minimum: 0 }
                stok: { type: integer, minimum: 0 }
                satuan: { type: string }
                foto: { type: string, format: binary }
      responses:
        "201": { description: Produk dibuat }
        "400": { description: Data atau foto tidak valid }
        "413": { description: Foto melebihi 5 MB }
  /v1/products/me:
    get:
      operationId: listMyProducts
      summary: Seluruh produk milik akun aktif
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar produk aktif dan nonaktif }
        "401": { description: Token tidak valid }
  /v1/products/{id}:
    patch:
      operationId: updateProduct
      summary: Ubah produk atau ganti foto
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Produk diperbarui }
        "404": { description: Produk tidak ditemukan atau bukan milik pengguna }
    delete:
      operationId: disableProduct
      summary: Nonaktifkan produk
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Produk dinonaktifkan }
        "404": { description: Produk tidak ditemukan atau bukan milik pengguna }
  /health:
    get:
      operationId: gatewayHealth
      summary: Cek kesehatan gateway
      security: []
      responses:
        "200": { description: Layanan sehat }
        "400": { description: Permintaan tidak valid }
  /v1/items:
    get:
      operationId: listItems
      summary: Daftar barang katalog
      security: []
      responses:
        "200": { description: Daftar barang }
        "400": { description: Permintaan tidak valid }
  /v1/toko:
    get:
      operationId: listStoresPublic
      summary: Daftar toko aktif
      security: []
      responses:
        "200": { description: Daftar toko }
        "400": { description: Permintaan tidak valid }
  /v1/login:
    post:
      operationId: loginUser
      summary: Terbitkan JWT pengembangan
      security: []
      responses:
        "200": { description: JWT diterbitkan }
        "401": { description: Email atau password salah }
  /v1/register:
    post:
      operationId: registerUser
      summary: Daftarkan akun penitip atau penjastip
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, password]
              properties:
                nama: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        "201": { description: Akun dibuat }
        "409": { description: Email telah terdaftar }
  /v1/sessions:
    get:
      operationId: listOpenSessions
      summary: Daftar sesi jastip terbuka
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Nomor halaman
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Ukuran halaman
      responses:
        "200": { description: Daftar sesi }
        "400": { description: Parameter pagination tidak valid }
    post:
      operationId: createSession
      summary: Buka sesi jastip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201": { description: Sesi dibuat }
        "400": { description: Input tidak valid }
        "403": { description: Bukan penjastip }
  /v1/titipan:
    post:
      operationId: createTitipan
      summary: Reservasi kapasitas dan buat titipan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TitipanInput" }
      responses:
        "201": { description: Titipan dibuat }
        "200": { description: Hasil request idempoten }
        "409": { description: Sesi penuh/tutup/kedaluwarsa }
        "429":
          description: Batas laju terlampaui
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Batas request per jendela waktu
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Sisa request pada jendela saat ini
            Retry-After:
              schema: { type: integer }
              description: Lama tunggu (detik) sebelum mencoba lagi
  /v1/titipan/me:
    get:
      operationId: listMyTitipan
      summary: Daftar titipan milik akun
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Riwayat titipan }
        "401": { description: Token tidak valid }
  /v1/titipan/{id}/cancel:
    post:
      operationId: cancelTitipan
      summary: Batalkan titipan dan lepaskan kapasitas tepat sekali
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses: { "200": { description: Dibatalkan }, "409": { description: Tidak dapat dibatalkan } }
  /v1/titipan/{id}/offers:
    post:
      operationId: reviseOffer
      summary: Revisi tawaran biaya jasa
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses: { "201": { description: Tawaran dibuat }, "409": { description: Reservasi/titipan tidak valid } }
  /v1/offers/{id}:
    patch:
      operationId: decideOffer
      summary: Penjastip menerima atau menolak tawaran
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses: { "200": { description: Keputusan tersimpan }, "409": { description: Transisi tidak valid } }
  /v1/payments:
    post:
      operationId: createPayment
      summary: Tahan dana titipan dalam escrow
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "201": { description: Dana tertahan }
        "409": { description: Titipan telah dibayar }
        "503": { description: Order service tidak tersedia }
  /v1/tracking/{titipanId}:
    get:
      operationId: getTracking
      summary: Riwayat tracking
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: titipanId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Riwayat status }
        "404": { description: Titipan tidak ditemukan }
  /v1/tracking:
    post:
      operationId: advanceTracking
      summary: Tambahkan status berikutnya
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Status dicatat }
        "409": { description: Transisi tidak berurutan }
  /v1/tracking/{titipanId}/confirm-received:
    post:
      operationId: confirmReceived
      summary: Penitip mengonfirmasi diterima dan memicu pelepasan escrow
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: titipanId
          required: true
          schema: { type: integer }
      responses: { "201": { description: Barang diterima }, "409": { description: Barang belum diantar } }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      summary: Daftar akun dengan pencarian, filter, dan pagination
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar akun }
        "403": { description: Bukan admin }
    post:
      operationId: adminCreateUser
      summary: Buat akun oleh admin, termasuk admin tambahan
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Akun dibuat }
        "409": { description: Email sudah digunakan }
  /v1/admin/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: adminGetUser
      summary: Detail akun
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Detail akun }
        "404": { description: Akun tidak ditemukan }
    patch:
      operationId: adminUpdateUser
      summary: Ubah profil, role, password, atau status akun
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Akun diperbarui }
        "409": { description: Melanggar perlindungan admin terakhir }
    delete:
      operationId: adminDeleteUser
      summary: Nonaktifkan akun
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Akun dinonaktifkan }
        "409": { description: Admin sendiri atau admin terakhir }
  /v1/admin/stores:
    get:
      operationId: adminListStores
      summary: Daftar seluruh toko
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar toko }
        "403": { description: Bukan admin }
    post:
      operationId: adminCreateStore
      summary: Buat toko dengan owner penjastip aktif
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Toko dibuat }
        "409": { description: Owner tidak valid }
  /v1/admin/stores/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: adminUpdateStore
      summary: Ubah toko atau owner
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Toko diperbarui }
        "404": { description: Toko tidak ditemukan }
    delete:
      operationId: adminDeleteStore
      summary: Nonaktifkan toko dan produknya
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Toko dinonaktifkan }
        "409": { description: Masih memiliki sesi aktif }
  /v1/admin/products:
    get:
      operationId: adminListProducts
      summary: Daftar seluruh produk
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar produk }
        "403": { description: Bukan admin }
    post:
      operationId: adminCreateProduct
      summary: Buat produk; foto JPG, PNG, atau WEBP maksimal 5 MB
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tokoId, nama, kategori, harga, stok, satuan]
              properties:
                tokoId: { type: integer }
                nama: { type: string }
                kategori: { type: string }
                harga: { type: integer, minimum: 0 }
                stok: { type: integer, minimum: 0 }
                satuan: { type: string }
                foto: { type: string, format: binary }
      responses:
        "201": { description: Produk dibuat }
        "413": { description: Foto terlalu besar }
  /v1/admin/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: adminUpdateProduct
      summary: Ubah produk atau ganti foto
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Produk diperbarui }
        "404": { description: Produk tidak ditemukan }
    delete:
      operationId: adminDeleteProduct
      summary: Nonaktifkan produk
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Produk dinonaktifkan }
        "404": { description: Produk tidak ditemukan }
  /v1/admin/sessions:
    get:
      operationId: adminListSessions
      summary: Daftar seluruh sesi
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar sesi }
        "403": { description: Bukan admin }
  /v1/admin/orders:
    get:
      operationId: adminListOrders
      summary: Daftar seluruh titipan
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar titipan }
        "403": { description: Bukan admin }
  /v1/admin/payments:
    get:
      operationId: adminListPayments
      summary: Daftar seluruh pembayaran
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar pembayaran }
        "403": { description: Bukan admin }
  /v1/admin/tracking:
    get:
      operationId: adminListTracking
      summary: Daftar seluruh event tracking
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar event }
        "403": { description: Bukan admin }
  /v1/admin/audit:
    get:
      operationId: adminListAudit
      summary: Audit aksi admin
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Daftar audit }
        "403": { description: Bukan admin }
