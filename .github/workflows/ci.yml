name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: jastip_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d jastip_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jastip_test
      JWT_SECRET: test-jwt-secret-minimal-32-karakter
      SERVICE_TOKEN: test-service-token-minimal-32-karakter
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Install and test PostgreSQL services
        run: |
          npm --prefix services/catalog-service ci
          npm --prefix services/order-service ci
          npm --prefix services/payment-service ci
          npm --prefix services/tracking-service ci
          npm --prefix services/catalog-service test
          npm --prefix services/order-service test
          npm --prefix services/payment-service test
          npm --prefix services/tracking-service test
      - name: Check service syntax
        run: |
          node --check services/catalog-service/index.js
          node --check services/payment-service/index.js
          node --check services/tracking-service/index.js
      - name: Build Expo web bundle
        working-directory: mobile
        run: npm ci && npx expo export --platform web --output-dir dist-ci
